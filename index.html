<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>تعلّم الحروف العربية</title>
  <style>
    :root {
      --bg: #F5F3FF;
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --primary-light: #6366F1;
      --border: #C7D2FE;
      --text: #1E1B4B;
      --ok: #22C55E;
      --bad: #EF4444;
      --warn: #D97706;
      --gold: #F59E0B;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app { width: 100%; max-width: 540px; padding-bottom: 28px; }
    header {
      background: var(--primary);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title { font-size: 1.1rem; font-weight: 800; }
    .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .chip {
      background: var(--primary-light);
      padding: 4px 9px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
    }
    .chip.timer-chip { background: #FEF3C7; color: #92400E; }
    .chip.timer-chip.urgent { background: #FEE2E2; color: #991B1B; }
    .icon-btn {
      background: var(--primary-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    .stages-screen { padding: 14px; }
    .screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .screen-head h2 { margin: 0; font-size: 1.15rem; font-weight: 800; }
    .sub-note { font-size: 0.85rem; color: #4B5563; margin-bottom: 12px; font-weight: 600; }
    .stages-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .st-card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      font-weight: 800;
      color: var(--primary-dark);
      transition: transform 0.12s;
    }
    .st-card:active { transform: scale(0.96); }
    .st-card.done {
      background: #DCFCE7;
      border-color: var(--ok);
      color: #166534;
    }
    .st-card.locked {
      background: #E5E7EB;
      border-color: #D1D5DB;
      color: #6B7280;
      cursor: not-allowed;
      opacity: 0.8;
    }
    .st-num { font-size: 1rem; }
    .st-sub { font-size: 0.72rem; margin-top: 3px; }

    .game-screen { display: none; }
    .game-screen.active { display: block; }
    .stages-screen.hidden { display: none; }

    .top-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 4px;
      gap: 8px;
    }
    .back-btn {
      background: #E0E7FF;
      color: var(--primary-dark);
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .mission-badge {
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--primary-dark);
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px 14px 8px;
    }
    .lvl-btn {
      background: #E0E7FF;
      color: var(--primary-dark);
      border: 2px solid #E0E7FF;
      border-radius: 12px;
      padding: 8px 4px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .lvl-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .lvl-btn.passed {
      border-color: var(--ok);
      background: #ECFDF5;
      color: #166534;
    }
    .lvl-btn.active.passed {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 18px;
      margin: 4px 14px 0;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.07);
      position: relative;
      overflow: hidden;
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }
    .card.win-card {
      background: #F0FDF4;
      border-color: var(--ok);
      box-shadow: 0 10px 26px rgba(34, 197, 94, 0.22);
      transform: scale(1.015);
    }
    .stage {
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .emoji-big { font-size: 4.6rem; line-height: 1.1; transition: transform 0.25s; }
    .emoji-big.win-bounce { animation: winBounce 0.7s ease infinite alternate; }
    @keyframes winBounce {
      0% { transform: scale(1) rotate(-4deg); }
      100% { transform: scale(1.18) rotate(4deg); }
    }
    .clap-banner {
      font-size: 1.7rem;
      font-weight: 900;
      color: #15803D;
      animation: clapPulse 0.45s ease infinite alternate;
    }
    @keyframes clapPulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.08); }
    }
    .word-txt {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 2px;
    }
    .word-txt.win-word {
      color: #15803D;
    }
    .qrow { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
    .q-btn {
      background: #FEF3C7;
      border: 2px solid #FCD34D;
      border-radius: 14px;
      padding: 8px 18px;
      font-size: 1.4rem;
      cursor: pointer;
      font-weight: 700;
    }
    .listen-btn {
      background: #DCFCE7;
      border: 2px solid #86EFAC;
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .hint { font-size: 0.85rem; color: #6B7280; margin-top: 6px; min-height: 18px; }

    .alert-box {
      display: none;
      margin: 10px 14px 0;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      text-align: center;
    }
    .alert-box.show { display: block; }
    .alert-box.bad {
      background: #FEE2E2;
      color: #991B1B;
      border: 2px solid #FCA5A5;
    }
    .alert-box.warn {
      background: #FEF3C7;
      color: #92400E;
      border: 2px solid #FCD34D;
    }
    .alert-box.ok {
      background: #DCFCE7;
      color: #166534;
      border: 2px solid #86EFAC;
    }

    .msg {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      min-height: 32px;
      margin: 8px 14px 4px;
    }
    .prog-wrap {
      width: 280px;
      max-width: 80%;
      height: 10px;
      background: #DDD6FE;
      border-radius: 999px;
      margin: 0 auto 12px;
      overflow: hidden;
    }
    .prog-bar {
      height: 100%;
      width: 0%;
      background: var(--gold);
      transition: width 0.25s ease;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 14px;
    }
    .opt-btn {
      background: #fff;
      color: var(--primary-dark);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 6px;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .opt-btn.text-opt { font-size: 1.2rem; }
    .opt-btn:active { transform: scale(0.97); }
    .opt-btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .opt-btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
  </style>
</head>
<body class="notranslate">
  <div class="app">
    <header>
      <div class="title">🔤 تعلّم الحروف</div>
      <div class="chips">
        <span class="chip timer-chip" id="timerChip">⏱️ 15</span>
        <span class="chip" id="scoreChip">⭐ 0</span>
        <span class="chip" id="starsChip">🏅 0</span>
        <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
      </div>
    </header>

    <section class="stages-screen" id="stagesScreen">
      <div class="screen-head">
        <h2>المهام (30 مهمة)</h2>
        <span class="chip" id="unlockedChip">مفتوحة: 1 / 30</span>
      </div>
      <div class="sub-note">اعبر المستويات الـ 4 في كل مهمة حتى تفتح المهمة اللي بعدها.</div>
      <div class="stages-grid" id="stagesGrid"></div>
    </section>

    <section class="game-screen" id="gameScreen">
      <div class="top-subbar">
        <button class="back-btn" onclick="openStagesScreen()">← المهام</button>
        <div class="mission-badge" id="missionBadge">مهمة 1</div>
      </div>

      <div class="levels">
        <button class="lvl-btn active" data-lvl="1" onclick="selectLevel(1)">١ مع الكلمة</button>
        <button class="lvl-btn" data-lvl="2" onclick="selectLevel(2)">٢ بدون كلمة</button>
        <button class="lvl-btn" data-lvl="3" onclick="selectLevel(3)">٣ موقع الحرف</button>
        <button class="lvl-btn" data-lvl="4" onclick="selectLevel(4)">٤ فراغ وحرف</button>
      </div>

      <div class="card" id="mainCard">
        <div class="stage" id="stage"></div>
        <div class="qrow">
          <button class="q-btn" id="qBtn" onclick="speakQuestionNow()">❓🔤</button>
          <button class="listen-btn" onclick="speakTargetNow()">🔈</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="alert-box" id="alertBox"></div>
      <div class="msg" id="msg"></div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
      <div class="options" id="options"></div>
    </section>
  </div>

  <script>
    const TOTAL_MISSIONS = 30;
    const QUESTION_SECONDS = 15;

    const DATA = [
      ["أ", "أسد", "🦁"], ["ب", "بطة", "🦆"], ["ت", "تفاحة", "🍎"],
      ["ث", "ثعلب", "🦊"], ["ج", "جمل", "🐪"], ["ح", "حصان", "🐴"],
      ["خ", "خروف", "🐑"], ["د", "دجاجة", "🐔"], ["ذ", "ذرة", "🌽"],
      ["ر", "رمان", "🍎"], ["ز", "زرافة", "🦒"], ["س", "سمكة", "🐟"],
      ["ش", "شمس", "☀️"], ["ص", "صاروخ", "🚀"], ["ض", "ضفدع", "🐸"],
      ["ط", "طائرة", "✈️"], ["ظ", "ظرف", "✉️"], ["ع", "عنب", "🍇"],
      ["غ", "غيمة", "☁️"], ["ف", "فيل", "🐘"], ["ق", "قمر", "🌙"],
      ["ك", "كلب", "🐶"], ["ل", "ليمون", "🍋"], ["م", "موز", "🍌"],
      ["ن", "نحلة", "🐝"], ["ه", "هدية", "🎁"], ["و", "وردة", "🌹"],
      ["ي", "يد", "✋"]
    ];
    const ALL_LETTERS = new Set(DATA.map(d => d[0]));
    const POSITIONS = ["أول", "وسط", "آخر"];
    const PRAISE = ["أحسنت يا بطل!", "ممتاز جداً!", "رائع وبطل!", "برافو عليك!", "عظيم جداً!"];

    let maxUnlockedMission = 1;
    let passedByMission = {};
    let currentMission = 1;
    let level = 1;
    let score = 0;
    let stars = 0;
    let soundOn = true;
    let locked = false;
    let timeLeft = QUESTION_SECONDS;
    let current = null;
    let recentKeys = [];
    let nextTimer = null;
    let countdownId = null;

    let audioCtx = null;
    function getAudioCtx() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) {
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended" || audioCtx.state === "interrupted") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function unlockAudioOnFirstTouch() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
      } catch (_) {}
    }

    document.addEventListener("touchstart", unlockAudioOnFirstTouch, { passive: true });
    document.addEventListener("pointerdown", unlockAudioOnFirstTouch, { passive: true });

    function playSoftTone(freq, ms, vol = 0.22) {
      if (!soundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        const now = ctx.currentTime;
        const dur = Math.max(0.08, ms / 1000);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      } catch (_) {}
    }

    function playMelody(notes, vol = 0.22) {
      let delay = 0;
      for (const [f, d] of notes) {
        setTimeout(() => playSoftTone(f, d, vol), delay);
        delay += d + 30;
      }
    }

    function playGentleClap() {
      if (!soundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const beats = [0, 140, 280, 420];
      beats.forEach((delay, idx) => {
        setTimeout(() => {
          try {
            const len = Math.floor(ctx.sampleRate * 0.07);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const ch = buf.getChannelData(0);
            for (let i = 0; i < len; i++) {
              const env = Math.pow(1 - i / len, 2.2);
              ch[i] = (Math.random() * 2 - 1) * env * 0.55;
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;

            const bp = ctx.createBiquadFilter();
            bp.type = "bandpass";
            bp.frequency.value = 1250;
            bp.Q.value = 1.0;

            const gain = ctx.createGain();
            gain.gain.value = idx === beats.length - 1 ? 0.65 : 0.45;

            src.connect(bp);
            bp.connect(gain);
            gain.connect(ctx.destination);
            src.start();
          } catch (_) {}
        }, delay);
      });

      setTimeout(() => {
        playMelody([[523, 120], [659, 130], [784, 200]], 0.24);
      }, 520);
    }

    function pickArabicVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      return (
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ar-sa")) ||
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ar")) ||
        null
      );
    }

    if ("speechSynthesis" in window && typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
      window.speechSynthesis.onvoiceschanged = () => pickArabicVoice();
    }

    function speakArabic(text) {
      if (!soundOn || !text || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const v = pickArabicVoice();
        if (v) u.voice = v;
        u.lang = v ? v.lang : "ar-SA";
        u.rate = 0.9;
        u.pitch = 1.02;
        window.speechSynthesis.speak(u);
      } catch (_) {}
    }

    function speakQuestionNow() {
      if (!current) return;
      unlockAudioOnFirstTouch();
      speakArabic(current.questionSpoken);
    }

    function speakTargetNow() {
      if (!current) return;
      unlockAudioOnFirstTouch();
      speakArabic(current.targetText);
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById("soundBtn").textContent = soundOn ? "🔊" : "🔇";
      if (!soundOn && "speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      } else if (soundOn) {
        unlockAudioOnFirstTouch();
        if (current) speakQuestionNow();
      }
    }

    function setAlert(type, text) {
      const box = document.getElementById("alertBox");
      if (!text) {
        box.className = "alert-box";
        box.textContent = "";
        return;
      }
      box.className = "alert-box show " + type;
      box.textContent = text;
    }

    function getMissionSet(m) {
      if (!passedByMission[m]) passedByMission[m] = new Set();
      return passedByMission[m];
    }

    function renderStagesScreen() {
      clearInterval(countdownId);
      clearTimeout(nextTimer);
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }

      document.getElementById("stagesScreen").classList.remove("hidden");
      document.getElementById("gameScreen").classList.remove("active");
      document.getElementById("unlockedChip").textContent = `مفتوحة: ${maxUnlockedMission} / ${TOTAL_MISSIONS}`;

      const grid = document.getElementById("stagesGrid");
      grid.innerHTML = "";

      for (let m = 1; m <= TOTAL_MISSIONS; m++) {
        const isUnlocked = m <= maxUnlockedMission;
        const passedCount = getMissionSet(m).size;
        const isDone = passedCount >= 4;

        const card = document.createElement("button");
        card.className = "st-card" + (isDone ? " done" : (!isUnlocked ? " locked" : ""));
        card.disabled = !isUnlocked;
        card.innerHTML = `
          <div class="st-num">${!isUnlocked ? "🔒" : (isDone ? "✅" : "🎯")} ${m}</div>
          <div class="st-sub">${!isUnlocked ? "مقفول" : `${passedCount}/4`}</div>
        `;
        if (isUnlocked) {
          card.onclick = () => {
            unlockAudioOnFirstTouch();
            startMission(m);
          };
        }
        grid.appendChild(card);
      }
    }

    function openStagesScreen() {
      renderStagesScreen();
    }

    function updateLevelButtonsUI() {
      const set = getMissionSet(currentMission);
      document.querySelectorAll(".lvl-btn").forEach(b => {
        const l = Number(b.dataset.lvl);
        b.classList.toggle("active", l === level);
        b.classList.toggle("passed", set.has(l));
      });
    }

    function startMission(m) {
      currentMission = m;
      const set = getMissionSet(m);
      const firstUnpassed = [1, 2, 3, 4].find(l => !set.has(l));
      level = firstUnpassed || 1;

      document.getElementById("stagesScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.add("active");
      document.getElementById("missionBadge").textContent = `مهمة ${currentMission} من ${TOTAL_MISSIONS}`;
      updateLevelButtonsUI();
      loadQuestion(true);
    }

    function selectLevel(lvl) {
      unlockAudioOnFirstTouch();
      clearTimeout(nextTimer);
      clearInterval(countdownId);
      level = lvl;
      updateLevelButtonsUI();
      loadQuestion(true);
    }

    function updateStats() {
      const passedCount = getMissionSet(currentMission).size;
      document.getElementById("scoreChip").textContent = `⭐ ${score}`;
      document.getElementById("starsChip").textContent = `🏅 ${stars}`;
      document.getElementById("progBar").style.width = `${(passedCount / 4) * 100}%`;
    }

    function updateTimerUI() {
      const chip = document.getElementById("timerChip");
      chip.textContent = `⏱️ ${timeLeft}`;
      chip.classList.toggle("urgent", timeLeft <= 5);
    }

    function startTimer() {
      clearInterval(countdownId);
      timeLeft = QUESTION_SECONDS;
      updateTimerUI();
      countdownId = setInterval(() => {
        if (locked) return;
        timeLeft -= 1;
        updateTimerUI();
        if (timeLeft <= 5 && timeLeft > 0) {
          playSoftTone(440, 80, 0.14);
        }
        if (timeLeft <= 0) {
          clearInterval(countdownId);
          onTimeUp();
        }
      }, 1000);
    }

    function onTimeUp() {
      if (locked || !current) return;
      locked = true;
      playMelody([[330, 150], [262, 200]], 0.22);
      setAlert("warn", `⏰ انتهى الوقت (15 ثانية)! الجواب الصحيح: "${current.correct}"`);
      document.getElementById("msg").style.color = "var(--warn)";
      document.getElementById("msg").textContent = "سؤال جديد...";
      nextTimer = setTimeout(() => loadQuestion(true), 1900);
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickDiverseItem(lvl) {
      const baseIndex = (currentMission * 3 + level * 5 + score) % DATA.length;
      const candidates = [];
      for (let offset = 0; offset < DATA.length; offset++) {
        const idx = (baseIndex + offset * 7) % DATA.length;
        const key = `${lvl}-${idx}`;
        if (!recentKeys.includes(key)) {
          candidates.push(idx);
        }
      }
      const chosenIdx = candidates.length
        ? candidates[Math.floor(Math.random() * Math.min(4, candidates.length))]
        : ((baseIndex + Math.floor(Math.random() * DATA.length)) % DATA.length);

      const qKey = `${lvl}-${chosenIdx}`;
      recentKeys.push(qKey);
      if (recentKeys.length > 14) recentKeys.shift();
      return DATA[chosenIdx];
    }

    function makeBlankWord(word, targetLetter) {
      const chars = [...word];
      let replaced = false;
      for (let i = 0; i < chars.length; i++) {
        if (chars[i] === targetLetter && !replaced) {
          chars[i] = "_";
          replaced = true;
        }
      }
      if (!replaced && chars.length > 0) {
        chars[0] = "_";
      }
      return chars.join(" ");
    }

    function buildQuestion(lvl) {
      const [letter, word, emoji] = pickDiverseItem(lvl);
      const pool = DATA.filter(d => d[0] !== letter);
      const wrongs = shuffle(pool).slice(0, 2).map(d => d[0]);

      if (lvl === 1) {
        return {
          icon: "❓🔤",
          hint: "المستوى ١ (سهل): بأي حرف تبدأ الكلمة؟",
          emoji,
          word,
          options: shuffle([letter, ...wrongs]),
          correct: letter,
          questionSpoken: `بأي حرف تبدأ كلمة ${word}؟`,
          targetText: word
        };
      }

      if (lvl === 2) {
        return {
          icon: "❓🖼️",
          hint: "المستوى ٢: خمن الحرف من الصورة بدون كلمة",
          emoji,
          word: "",
          options: shuffle([letter, ...wrongs]),
          correct: letter,
          questionSpoken: "بأي حرف تبدأ هذه الصورة؟",
          targetText: word
        };
      }

      if (lvl === 3) {
        const cands = [...word].filter(c => ALL_LETTERS.has(c) && word.split(c).length - 1 === 1);
        const c = cands.length ? cands[0] : letter;
        const posIdx = word.indexOf(c);
        const correct = posIdx === 0 ? POSITIONS[0] : (posIdx === word.length - 1 ? POSITIONS[2] : POSITIONS[1]);
        return {
          icon: `📍 ${c}`,
          hint: `المستوى ٣: أين موقع حرف "${c}" في الكلمة؟`,
          emoji,
          word,
          options: [...POSITIONS],
          correct,
          questionSpoken: `أين موقع الحرف في كلمة ${word}؟`,
          targetText: word
        };
      }

      const blankDisplay = makeBlankWord(word, letter);
      return {
        icon: "🧩",
        hint: "المستوى ٤ (الأصعب): أكمل الفراغ بحرف واحد",
        emoji,
        word: blankDisplay,
        options: shuffle([letter, ...wrongs]),
        correct: letter,
        questionSpoken: "أكمل الفراغ بالحرف الناقص",
        targetText: word
      };
    }

    function loadQuestion(autoSpeak = false) {
      clearTimeout(nextTimer);
      clearInterval(countdownId);
      locked = false;
      setAlert("", "");
      document.getElementById("mainCard").classList.remove("win-card");
      document.getElementById("msg").textContent = "";
      updateStats();

      current = buildQuestion(level);
      document.getElementById("qBtn").textContent = current.icon;
      document.getElementById("hint").textContent = current.hint;

      const stage = document.getElementById("stage");
      stage.innerHTML = "";

      const em = document.createElement("div");
      em.className = "emoji-big";
      em.textContent = current.emoji;
      stage.appendChild(em);

      if (current.word) {
        const w = document.createElement("div");
        w.className = "word-txt";
        w.textContent = current.word;
        stage.appendChild(w);
      }

      const optsDiv = document.getElementById("options");
      optsDiv.innerHTML = "";
      const isTextOpt = (level === 3);
      current.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "opt-btn" + (isTextOpt ? " text-opt" : "");
        btn.textContent = opt;
        btn.onclick = () => onAnswer(opt, btn);
        optsDiv.appendChild(btn);
      });

      startTimer();
      if (autoSpeak) {
        setTimeout(() => speakArabic(current.questionSpoken), 180);
      }
    }

    function showCorrectCelebration() {
      document.getElementById("mainCard").classList.add("win-card");
      const stage = document.getElementById("stage");
      stage.innerHTML = "";

      const clapRow = document.createElement("div");
      clapRow.className = "clap-banner";
      clapRow.textContent = "👏✨👏";
      stage.appendChild(clapRow);

      if (current && current.emoji) {
        const em = document.createElement("div");
        em.className = "emoji-big win-bounce";
        em.textContent = current.emoji;
        stage.appendChild(em);
      }

      const w = document.createElement("div");
      w.className = "word-txt win-word";
      w.textContent = current.targetText;
      stage.appendChild(w);
    }

    function onAnswer(choice, btn) {
      if (locked || !current) return;
      unlockAudioOnFirstTouch();

      const msgEl = document.getElementById("msg");
      if (choice === current.correct) {
        locked = true;
        clearInterval(countdownId);
        score += 1;
        btn.classList.add("ok");

        showCorrectCelebration();
        playGentleClap();
        setTimeout(() => speakArabic(current.targetText), 650);

        const set = getMissionSet(currentMission);
        set.add(level);
        updateLevelButtonsUI();
        updateStats();

        const pText = PRAISE[Math.floor(Math.random() * PRAISE.length)];
        msgEl.style.color = "#15803D";
        msgEl.textContent = `${pText} 👏🌟`;
        setAlert("ok", `🎉 إجابة صحيحة! أحسنت يا بطل — "${current.targetText}"`);

        if (set.size >= 4) {
          stars += 1;
          updateStats();
          if (currentMission < TOTAL_MISSIONS && maxUnlockedMission < currentMission + 1) {
            maxUnlockedMission = currentMission + 1;
          }
          setAlert("ok", `🏆 كفو! عبرت كل مستويات المهمة ${currentMission} وانفتحت المهمة ${Math.min(TOTAL_MISSIONS, currentMission + 1)}`);
          nextTimer = setTimeout(() => {
            renderStagesScreen();
          }, 2400);
        } else {
          const nextLvl = [1, 2, 3, 4].find(l => !set.has(l)) || (level < 4 ? level + 1 : 1);
          nextTimer = setTimeout(() => {
            level = nextLvl;
            updateLevelButtonsUI();
            loadQuestion(true);
          }, 2200);
        }
      } else {
        btn.classList.add("bad");
        setAlert("bad", `⚠️ تحذير: اختيارك "${choice}" غير صحيح! حاول مرة ثانية`);
        msgEl.style.color = "var(--bad)";
        msgEl.textContent = "إجابة خاطئة ❌";
        playMelody([[311, 150], [233, 200]], 0.24);
      }
    }

    renderStagesScreen();
  </script>
</body>
