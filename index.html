<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>تعلّم الحروف العربية</title>
  <style>
    :root {
      --bg: #F5F3FF;
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --primary-light: #6366F1;
      --border: #C7D2FE;
      --text: #1E1B4B;
      --ok: #22C55E;
      --bad: #EF4444;
      --warn: #D97706;
      --gold: #F59E0B;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app { width: 100%; max-width: 540px; padding-bottom: 28px; }
    header {
      background: var(--primary);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title { font-size: 1.1rem; font-weight: 800; }
    .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .chip {
      background: var(--primary-light);
      padding: 4px 9px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
    }
    .chip.timer-chip { background: #FEF3C7; color: #92400E; }
    .chip.timer-chip.urgent { background: #FEE2E2; color: #991B1B; }
    .icon-btn {
      background: var(--primary-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    .stages-screen { padding: 14px; }
    .screen-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .screen-head h2 { margin: 0; font-size: 1.15rem; font-weight: 800; }
    .sub-note { font-size: 0.85rem; color: #4B5563; margin-bottom: 12px; font-weight: 600; }
    .stages-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .st-card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      font-weight: 800;
      color: var(--primary-dark);
      transition: transform 0.12s;
    }
    .st-card:active { transform: scale(0.96); }
    .st-card.done {
      background: #DCFCE7;
      border-color: var(--ok);
      color: #166534;
    }
    .st-card.locked {
      background: #E5E7EB;
      border-color: #D1D5DB;
      color: #6B7280;
      cursor: not-allowed;
      opacity: 0.8;
    }
    .st-num { font-size: 1rem; }
    .st-sub { font-size: 0.72rem; margin-top: 3px; }

    .game-screen { display: none; }
    .game-screen.active { display: block; }
    .stages-screen.hidden { display: none; }

    .top-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 4px;
      gap: 8px;
    }
    .back-btn {
      background: #E0E7FF;
      color: var(--primary-dark);
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .mission-badge {
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--primary-dark);
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px 14px 8px;
    }
    .lvl-btn {
      background: #E0E7FF;
      color: var(--primary-dark);
      border: 2px solid #E0E7FF;
      border-radius: 12px;
      padding: 8px 4px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .lvl-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .lvl-btn.passed {
      border-color: var(--ok);
      background: #ECFDF5;
      color: #166534;
    }
    .lvl-btn.active.passed {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 18px;
      margin: 4px 14px 0;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.07);
      position: relative;
      overflow: hidden;
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }
    .card.win-card {
      background: #F0FDF4;
      border-color: var(--ok);
      box-shadow: 0 10px 26px rgba(34, 197, 94, 0.22);
      transform: scale(1.015);
    }
    .stage {
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .char-big {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--primary-dark);
      line-height: 1.15;
    }
    .emoji-big { font-size: 4.6rem; line-height: 1.1; transition: transform 0.25s; }
    .emoji-big.win-bounce { animation: winBounce 0.7s ease infinite alternate; }
    @keyframes winBounce {
      0% { transform: scale(1) rotate(-4deg); }
      100% { transform: scale(1.18) rotate(4deg); }
    }
    .clap-banner {
      font-size: 1.7rem;
      font-weight: 900;
      color: #15803D;
      animation: clapPulse 0.45s ease infinite alternate;
    }
    @keyframes clapPulse {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.08); }
    }
    .word-txt {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 2px;
    }
    .word-txt.win-word {
      color: #15803D;
    }
    .qrow { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
    .q-btn {
      background: #FEF3C7;
      border: 2px solid #FCD34D;
      border-radius: 14px;
      padding: 8px 18px;
      font-size: 1.4rem;
      cursor: pointer;
      font-weight: 700;
    }
    .listen-btn {
      background: #DCFCE7;
      border: 2px solid #86EFAC;
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .hint { font-size: 0.85rem; color: #6B7280; margin-top: 6px; min-height: 18px; }

    .alert-box {
      display: none;
      margin: 10px 14px 0;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      text-align: center;
    }
    .alert-box.show { display: block; }
    .alert-box.bad {
      background: #FEE2E2;
      color: #991B1B;
      border: 2px solid #FCA5A5;
    }
    .alert-box.warn {
      background: #FEF3C7;
      color: #92400E;
      border: 2px solid #FCD34D;
    }
    .alert-box.ok {
      background: #DCFCE7;
      color: #166534;
      border: 2px solid #86EFAC;
    }

    .msg {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      min-height: 32px;
      margin: 8px 14px 4px;
    }
    .prog-wrap {
      width: 280px;
      max-width: 80%;
      height: 10px;
      background: #DDD6FE;
      border-radius: 999px;
      margin: 0 auto 12px;
      overflow: hidden;
    }
    .prog-bar {
      height: 100%;
      width: 0%;
      background: var(--gold);
      transition: width 0.25s ease;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 14px;
    }
    .opt-btn {
      background: #fff;
      color: var(--primary-dark);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 6px;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .opt-btn.text-opt { font-size: 1.2rem; }
    .opt-btn:active { transform: scale(0.97); }
    .opt-btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .opt-btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
  </style>
</head>
<body class="notranslate">
  <div class="app">
    <header>
      <div class="title">🔤 تعلّم الحروف</div>
      <div class="chips">
        <span class="chip timer-chip" id="timerChip">⏱️ 15</span>
        <span class="chip" id="scoreChip">⭐ 0</span>
        <span class="chip" id="starsChip">🏅 0</span>
        <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
      </div>
    </header>

    <section class="stages-screen" id="stagesScreen">
      <div class="screen-head">
        <h2>المهام (30 مهمة)</h2>
        <span class="chip" id="unlockedChip">مفتوحة: 1 / 30</span>
      </div>
      <div class="sub-note">اعبر المستويات الـ 4 في كل مهمة حتى تفتح المهمة اللي بعدها.</div>
      <div class="stages-grid" id="stagesGrid"></div>
    </section>

    <section class="game-screen" id="gameScreen">
      <div class="top-subbar">
        <button class="back-btn" onclick="openStagesScreen()">← المهام</button>
        <div class="mission-badge" id="missionBadge">مهمة 1</div>
      </div>

      <div class="levels">
        <button class="lvl-btn active" data-lvl="1" onclick="selectLevel(1)">١ مع الكلمة</button>
        <button class="lvl-btn" data-lvl="2" onclick="selectLevel(2)">٢ بدون كلمة</button>
        <button class="lvl-btn" data-lvl="3" onclick="selectLevel(3)">٣ موقع الحرف</button>
        <button class="lvl-btn" data-lvl="4" onclick="selectLevel(4)">٤ فراغ وحرف</button>
      </div>

      <div class="card" id="mainCard">
        <div class="stage" id="stage"></div>
        <div class="qrow">
          <button class="q-btn" id="qBtn" onclick="speakQuestionNow()">❓🔤</button>
          <button class="listen-btn" onclick="speakTargetNow()">🔈</button>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="alert-box" id="alertBox"></div>
      <div class="msg" id="msg"></div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
      <div class="options" id="options"></div>
    </section>
  </div>

  <script>
    const TOTAL_MISSIONS = 30;
    const QUESTION_SECONDS = 15;

    const DATA = [
      ["أ", "أسد", "🦁"], ["ب", "بطة", "🦆"], ["ت", "تفاحة", "🍎"],
      ["ث", "ثعلب", "🦊"], ["ج", "جمل", "🐪"], ["ح", "حصان", "🐴"],
      ["خ", "خروف", "🐑"], ["د", "دجاجة", "🐔"], ["ذ", "ذرة", "🌽"],
      ["ر", "رمان", "🍎"], ["ز", "زرافة", "🦒"], ["س", "سمكة", "🐟"],
      ["ش", "شمس", "☀️"], ["ص", "صاروخ", "🚀"], ["ض", "ضفدع", "🐸"],
      ["ط", "طائرة", "✈️"], ["ظ", "ظرف", "✉️"], ["ع", "عنب", "🍇"],
      ["غ", "غيمة", "☁️"], ["ف", "فيل", "🐘"], ["ق", "قمر", "🌙"],
      ["ك", "كلب", "🐶"], ["ل", "ليمون", "🍋"], ["م", "موز", "🍌"],
      ["ن", "نحلة", "🐝"], ["ه", "هدية", "🎁"], ["و", "وردة", "🌹"],
      ["ي", "يد", "✋"]
    ];
    const HARAKAT = [
      ["َ", "فتحة"],
      ["ُ", "ضمة"],
      ["ِ", "كسرة"]
    ];
    const ALL_LETTERS = new Set(DATA.map(d => d[0]));
    const POSITIONS = ["أول", "وسط", "آخر"];
    const PRAISE = ["أحسنت يا بطل!", "ممتاز جداً!", "رائع وبطل!", "برافو عليك!", "عظيم جداً!"];

    let maxUnlockedMission = 1;
    let passedByMission = {};
    let currentMission = 1;
    let level = 1;
    let score = 0;
    let stars = 0;
    let soundOn = true;
    let locked = false;
    let timeLeft = QUESTION_SECONDS;
    let current = null;
    let questionQueues = {};
    let lastItemIndex = -1;
    let nextTimer = null;
    let countdownId = null;

    let audioCtx = null;
    function getAudioCtx() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) {
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended" || audioCtx.state === "interrupted") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function unlockAudioOnFirstTouch() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
      } catch (_) {}
    }

    document.addEventListener("touchstart", unlockAudioOnFirstTouch, { passive: true });
    document.addEventListener("pointerdown", unlockAudioOnFirstTouch, { passive: true });

    function playSoftTone(freq, ms, vol = 0.22) {
      if (!soundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.create
